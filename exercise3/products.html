<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
  </div>
  <nav class="navbar">
    <h1 class="logo">ShopEase</h1>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
  <section class="hero">
    <div class="hero-content">
      <h2>Discover the Future of Shopping</h2>
      <p>Explore top-rated products tailored for you.</p>
      <button class="cta">Shop Now</button>
    </div>
  </section>
  <section class="products">
    <h2 class="section-title">Featured Products</h2>
    <div class="product-grid">
      <div class="product-card" style="animation-delay: 0s;">
        <img src="https://via.placeholder.com/200x200?text=Product+1" alt="Product 1" />
        <h3>Smart Watch</h3>
        <p>R 199.99</p>
      </div>
      <div class="product-card" style="animation-delay: 0.1s;">
        <img src="https://via.placeholder.com/200x200?text=Product+2" alt="Product 2" />
        <h3>Wireless Earbuds</h3>
        <p>R 89.99</p>
      </div>
      <div class="product-card" style="animation-delay: 0.2s;">
        <img src="https://via.placeholder.com/200x200?text=Product+3" alt="Product 3" />
        <h3>VR Headset</h3>
        <p>R 299.99</p>
      </div>
      <div class="product-card" style="animation-delay: 0.3s;">
        <img src="https://via.placeholder.com/200x200?text=Product+4" alt="Product 4" />
        <h3>Bluetooth Speaker</h3>
        <p>R 59.99</p>
      </div>
      <div class="product-card" style="animation-delay: 0.4s;">
        <img src="https://via.placeholder.com/200x200?text=Product+5" alt="Product 5" />
        <h3>Smartphone</h3>
        <p>R 499.99</p>
      </div>
      <div class="product-card" style="animation-delay: 0.5s;">
        <img src="https://via.placeholder.com/200x200?text=Product+6" alt="Product 6" />
        <h3>Tablet Pro</h3>
        <p>R 399.99</p>
      </div>
    </div>
  </section>
  <script>
    // Hide loader after window loads
    window.onload = () => {
      document.getElementById('loader').style.display = 'none';
    };
  </script>
</body>
</html>
